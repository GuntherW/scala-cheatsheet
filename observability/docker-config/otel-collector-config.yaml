receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  # Kopiert Log-Attribute (MDC-Werte) als Resource-Attribute.
  # Loki indiziert Resource-Attribute als echte Labels - damit wird "host"
  # in Grafana als Label-Filter verfügbar (genauso wie "service_name").
  resource/logs:
    attributes:
      - action: upsert
        key: host
        from_attribute: host
      - action: upsert
        key: traceparent
        from_attribute: traceparent

exporters:
  # Metriken -> Prometheus
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "observability"
    # resource_to_telemetry_conversion: überträgt alle OTel Resource-Attribute
    # (z.B. service.name, host.name) als Labels auf jede Prometheus-Metrik.
    # Ohne diese Option gehen service.name usw. verloren - alle Services sehen
    # in Grafana identisch aus.
    resource_to_telemetry_conversion:
      enabled: true

  # Traces -> Tempo
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Logs -> Loki (seit Loki v3 direkt per OTLP/HTTP)
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # Debug-Ausgabe auf Konsole
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/tempo, debug]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]

    logs:
      receivers: [otlp]
      processors: [batch, resource/logs]
      exporters: [otlp_http/loki, debug]
