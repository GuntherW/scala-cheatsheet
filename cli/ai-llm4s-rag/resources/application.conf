llm4s {
  providers {
    provider = "requesty-claude"

    # Chat über den Anthropic-Provider gegen Requesty (der `requesty`-Provider von llm4s 0.4.1 funktioniert mit dem EU-Router nicht, siehe Readme_Architecture.md)
    requesty-claude {
      provider = "anthropic"
      model    = "vertex/claude-sonnet-5-5@eu"
      baseUrl  = "https://router.eu.requesty.ai"
      apiKey   = ${?ANTHROPIC_API_KEY}
    }
  }

  # llm4s 0.4.1: Embeddings laufen über den OpenAI-Provider, hier gegen den Requesty-EU-Router
  embeddings {
    model = "openai/azure/openai/text-embedding-3-small@francecentral"
    openai {
      baseUrl = "https://router.eu.requesty.ai"
    }
  }

  openai.apiKey = ${?ANTHROPIC_API_KEY}
}

# Observability: Traces per OpenTelemetry (OTLP/gRPC) an OpenObserve (siehe observability/OtelSink.scala und Readme_Usage.md).
# Abschalten: RAG_OBS_OTEL=false
rag.observability {
  enable.otel = true
  enable.otel = ${?RAG_OBS_OTEL}

  otel {
    serviceName   = "ai-rag-llm4s"
    endpoint      = "http://localhost:5081"
    endpoint      = ${?OTEL_EXPORTER_OTLP_ENDPOINT}
    authorization = ""
    authorization = ${?OTEL_AUTHORIZATION}
    organization  = "default"
    stream        = "default"
  }
}
