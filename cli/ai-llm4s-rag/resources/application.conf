llm4s {
  providers {
    provider = "requesty-claude"

    # Chat über den Anthropic-Provider (aus `llm4s-anthropic`) gegen Requesty (der EU-Router spricht die Anthropic-API; `baseUrl` ohne `/v1`, das SDK hängt den Pfad selbst an)
    requesty-claude {
      provider = "anthropic"
      model    = "vertex/claude-sonnet-5-5@eu"
      baseUrl  = "https://router.eu.requesty.ai"
      apiKey   = ${?ANTHROPIC_API_KEY}
    }
  }

  # Embeddings laufen über den OpenAI-Provider (aus `llm4s-openai`), hier gegen den Requesty-EU-Router.
  # Format `provider/model`: Provider-Id "openai", Modell "azure/openai/text-embedding-3-small@francecentral".
  embeddings {
    model = "openai/azure/openai/text-embedding-3-small@francecentral"
    openai {
      baseUrl = "https://router.eu.requesty.ai"
      apiKey  = ${?ANTHROPIC_API_KEY}
    }
  }
}

# Observability: Traces per OpenTelemetry (OTLP/gRPC) an OpenObserve (siehe observability/OtelSink.scala und Readme_Usage.md).
# Abschalten: RAG_OBS_OTEL=false
rag.observability {
  enable.otel = true
  enable.otel = ${?RAG_OBS_OTEL}

  otel {
    serviceName   = "ai-rag-llm4s"
    endpoint      = "http://localhost:5081"
    endpoint      = ${?OTEL_EXPORTER_OTLP_ENDPOINT}
    authorization = ""
    authorization = ${?OTEL_AUTHORIZATION}
    organization  = "default"
    stream        = "default"
  }
}
